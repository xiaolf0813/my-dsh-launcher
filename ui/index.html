<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>DSH Launcher</title>
<link rel="stylesheet" href="splash.css">
</head>
<body>
  <div class="splash">
    <div class="splash-drag" data-tauri-drag-region></div>
    <div class="splash-inner">
      <div class="whale-lottie" id="whale-lottie"></div>
      <div class="pname">DeepSeek Harness</div>
      <div class="loading" id="loading">
        <div class="status"><span id="status-text">正在启动 dsh 服务…</span></div>
        <div class="progress"><i></i></div>
      </div>
      <div class="err" id="err" hidden>
        <svg class="err-ic" viewBox="0 0 24 24" aria-hidden="true"><g fill="none" stroke="currentColor" stroke-width="1.4"><circle cx="12" cy="12" r="9"/><path d="M12 7.2v5.6"/></g><path d="M12 16.4h.01" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/></svg>
        <div class="err-title">启动失败</div>
        <div class="err-detail" id="err-detail">dsh web --no-open 未能启动本地服务。请确认 dsh 已安装并在 PATH 中，或检查端口是否被占用。</div>
        <div class="err-actions">
          <button class="btn btn-primary" id="btn-retry" type="button">重试</button>
          <button class="btn btn-ghost" id="btn-quit" type="button">退出</button>
        </div>
      </div>
    </div>
  </div>
  <div class="corner-brand">DSH Launcher <span id="app-ver"></span></div>
  <script src="lottie.min.js"></script>
  <script src="splash.js"></script>
</body>
</html>
